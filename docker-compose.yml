services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Dentro de la red de compose la base es `db:5432`. Esta variable pisa la
      # DATABASE_URL de backend/.env (que apunta a localhost:5433, para uvicorn local).
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Servidor de desarrollo de Vite. Requiere frontend/.env (copiar de frontend/.env.example).
  # design-system/ se monta en solo lectura en /design-system para que `../design-system` desde /app
  # resuelva igual que en local (el contexto de build ./frontend no lo incluye).
  # VITE_API_URL apunta al host (http://localhost:8000): lo usa el navegador, no el contenedor.
  frontend:
    build:
      context: ./frontend
      target: dev
    env_file:
      - ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./design-system:/design-system:ro
    depends_on:
      - backend

  # Sitio estatico (build de Vite + nginx) en http://localhost:8080. Solo con el perfil `prod`:
  #   docker compose --profile prod up -d --build frontend-prod
  # VITE_API_URL (de la raiz o del entorno) se incrusta al construir; la API debe ser alcanzable desde el navegador.
  # design-system/ llega como contexto adicional (el contexto ./frontend no lo incluye).
  frontend-prod:
    profiles: ["prod"]
    build:
      context: ./frontend
      target: prod
      additional_contexts:
        design-system: ./design-system
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
