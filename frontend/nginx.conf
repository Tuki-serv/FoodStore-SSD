# Servidor estatico de la imagen de produccion del frontend (objetivo `prod` del Dockerfile).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los assets con hash de Vite son inmutables: se cachean a largo plazo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Rutas del cliente (p. ej. /mis-pedidos): el enrutado lo resuelve la app, no el servidor.
    location / {
        try_files $uri /index.html;
    }
}
