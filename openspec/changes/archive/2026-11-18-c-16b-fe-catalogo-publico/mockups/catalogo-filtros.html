<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C-16 - Catálogo: filtros (Rev 2, pendiente de aprobación)</title>
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="mockup.css">
</head>
<body data-roles="CLIENT" data-current="catalogo">
<div class="shell" id="shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img class="sidebar-logo" src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <button class="icon-btn btn-collapse" id="btn-collapse" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Colapsar panel"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <button class="icon-btn btn-close" id="btn-close" type="button" aria-label="Cerrar menú"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav" aria-label="Principal"></nav>
  <div class="sidebar-foot">
    <span class="avatar" aria-hidden="true">LP</span>
    <div class="user-meta"><strong>Lucía Pérez</strong><small>CLIENT</small></div>
    <button class="icon-btn btn-logout" type="button" aria-label="Cerrar sesión"><svg class="ico" aria-hidden="true"><use href="#i-salir"/></svg></button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="shell-main">
  <div class="banner" id="banner">Mockup C-16 · Filtros: «Veganas» elegida y rango de precio inválido (desktop: columna; mobile: hoja «Filtros» abierta) · Revision 2 · pendiente de aprobación</div>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <img src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <a class="icon-btn" href="#/carrito" aria-label="Carrito, 3 productos"><svg class="ico" aria-hidden="true"><use href="#i-carrito"/></svg><span class="count" aria-hidden="true">3</span></a>
  </header>

  <main class="page page-wide">
    <div class="page-head">
      <h1>Catálogo</h1>
      <p>Elegí lo que tengas ganas y sumalo al carrito.</p>
    </div>
    <div class="cat-layout">
      <aside class="filters" id="filtros" aria-label="Filtros"></aside>
      <div class="cat-main">
        <div id="barra"></div>
        <div class="results-head">
          <h2 class="results-count" role="status">1 producto <small>en Veganas</small></h2>
          <div class="chips" id="chips"></div>
        </div>
        <ul class="prod-grid" id="grilla"></ul>
      </div>
    </div>
  </main>
</div>
</div>
<div class="modal-scrim" id="hoja-scrim">
  <div class="modal sheet" role="dialog" aria-modal="true" aria-labelledby="hoja-titulo">
    <div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="hoja-titulo">Filtros</h2>
      <button class="icon-btn" type="button" aria-label="Cerrar filtros"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></div>
    <div class="sheet-body" id="hoja-cuerpo"></div>
    <div class="sheet-foot"><button class="btn btn-ghost" type="button">Limpiar</button><button class="btn btn-primary" type="button">Ver 1 producto</button></div>
  </div>
</div>
<script src="../../../../design-system/brand.js"></script>
<script src="mockup.js"></script>
<script src="catalogo.js"></script>
<script>
(function () {
  var M = MOCK, P = M.P;
  var opts = { actual: 4, ancestros: [1], min: '3000', max: '1000', errMax: 'El mínimo no puede superar al máximo' };
  M.llenar('filtros', M.filtros(opts));
  M.llenar('barra', M.barra({ actualRaiz: 1, nFiltros: 1 }));
  M.llenar('chips', M.chip('Veganas'));
  M.llenar('grilla', M.tarjeta(P.vegana));
  opts.idp = 'h';
  M.llenar('hoja-cuerpo', M.filtros(opts));
  var desktop = window.matchMedia('(min-width: 1024px)');
  function sync() { document.getElementById('hoja-scrim').hidden = desktop.matches; }
  desktop.addEventListener('change', sync); sync();
})();
</script>
</body>
</html>
