<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C-16 - Catálogo: cargando (Rev 2, pendiente de aprobación)</title>
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="mockup.css">
</head>
<body data-roles="" data-current="catalogo">
<div class="shell" id="shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img class="sidebar-logo" src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <button class="icon-btn btn-collapse" id="btn-collapse" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Colapsar panel"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <button class="icon-btn btn-close" id="btn-close" type="button" aria-label="Cerrar menú"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav" aria-label="Principal"></nav>

</aside>
<div class="scrim" id="scrim"></div>

<div class="shell-main">
  <div class="banner" id="banner">Mockup C-16 · Catálogo cargando (esqueleto) · visitante sin sesión · Revision 2 · pendiente de aprobación · logo y nombre (TBD)</div>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <img src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">

  </header>

  <main class="page page-wide">
    <div class="page-head">
      <h1>Catálogo</h1>
      <p>Elegí lo que tengas ganas y sumalo al carrito.</p>
    </div>
    <div class="cat-layout">
      <aside class="filters" id="filtros" aria-label="Filtros"></aside>
      <div class="cat-main">
        <div id="barra"></div>
        <div class="results-head"><div class="skel" style="height:26px;width:160px"></div></div>
        <ul class="prod-grid" aria-busy="true" aria-label="Cargando productos"><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li><li><div class="card skel-prod" aria-hidden="true"><div class="img skel"></div><div class="body"><div class="skel" style="height:12px;width:40%"></div><div class="skel" style="height:20px;width:75%"></div><div class="skel" style="height:14px;width:90%"></div><div class="foot"><div class="skel" style="height:22px;width:35%"></div><div class="skel" style="height:36px;width:38%;border-radius:var(--radius-md)"></div></div></div></div></li></ul>
        <span class="sr" role="status">Cargando productos…</span>
      </div>
    </div>
  </main>
</div>
</div>

<script src="../../../../design-system/brand.js"></script>
<script src="mockup.js"></script>
<script src="catalogo.js"></script>
<script>
MOCK.llenar('filtros', MOCK.filtros({ actual: null }));
MOCK.llenar('barra', MOCK.barra({ actualRaiz: null }));
</script>
</body>
</html>
