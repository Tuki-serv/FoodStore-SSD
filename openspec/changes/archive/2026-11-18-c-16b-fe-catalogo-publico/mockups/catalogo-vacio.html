<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup C-16 - Catálogo: sin resultados (Rev 2, pendiente de aprobación)</title>
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="mockup.css">
</head>
<body data-roles="CLIENT" data-current="catalogo">
<div class="shell" id="shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img class="sidebar-logo" src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <button class="icon-btn btn-collapse" id="btn-collapse" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Colapsar panel"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <button class="icon-btn btn-close" id="btn-close" type="button" aria-label="Cerrar menú"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav" aria-label="Principal"></nav>
  <div class="sidebar-foot">
    <span class="avatar" aria-hidden="true">LP</span>
    <div class="user-meta"><strong>Lucía Pérez</strong><small>CLIENT</small></div>
    <button class="icon-btn btn-logout" type="button" aria-label="Cerrar sesión"><svg class="ico" aria-hidden="true"><use href="#i-salir"/></svg></button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="shell-main">
  <div class="banner" id="banner">Mockup C-16 · Sin resultados con filtros («sushi» + Solo con stock) · Revision 2 · pendiente de aprobación</div>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <img src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <a class="icon-btn" href="#/carrito" aria-label="Carrito, 3 productos"><svg class="ico" aria-hidden="true"><use href="#i-carrito"/></svg><span class="count" aria-hidden="true">3</span></a>
  </header>

  <main class="page page-wide">
    <div class="page-head">
      <h1>Catálogo</h1>
      <p>Elegí lo que tengas ganas y sumalo al carrito.</p>
    </div>
    <div class="cat-layout">
      <aside class="filters" id="filtros" aria-label="Filtros"></aside>
      <div class="cat-main">
        <div id="barra"></div>
        <div class="results-head" id="cabecera">
          <h2 class="results-count" role="status">0 productos</h2>
        </div>
        <section class="state empty" id="estado" aria-labelledby="estado-titulo"></section>
      </div>
    </div>
  </main>
</div>
</div>

<script src="../../../../design-system/brand.js"></script>
<script src="mockup.js"></script>
<script src="catalogo.js"></script>
<script>
(function () {
  var M = MOCK, ico = M.ico, est = document.getElementById('estado');
  if (M.estado === 'sin-productos') {
    document.getElementById('banner').textContent = 'Mockup C-16 · Catálogo sin productos (sin filtros) · Revision 2 · pendiente de aprobación';
    M.llenar('filtros', M.filtros({ actual: null }));
    M.llenar('barra', M.barra({ actualRaiz: null }));
    est.innerHTML = '<span class="badge-ico" aria-hidden="true">' + ico('i-plato') + '</span>' +
      '<h2 id="estado-titulo">Todavía no hay productos</h2><p>Estamos preparando el menú. Volvé en un rato.</p>';
  } else if (M.estado === 'error') {
    document.getElementById('banner').textContent = 'Mockup C-16 · Error al cargar el listado (503 / sin conexión), el árbol sí cargó · Revision 2 · pendiente de aprobación';
    M.llenar('filtros', M.filtros({ actual: 2 }));
    M.llenar('barra', M.barra({ actualRaiz: 2, nFiltros: 1 }));
    document.getElementById('cabecera').hidden = true;
    est.classList.add('is-error');
    est.setAttribute('role', 'alert');
    est.innerHTML = '<span class="badge-ico" aria-hidden="true">' + ico('i-alerta') + '</span>' +
      '<h2 id="estado-titulo">No pudimos cargar los productos</h2><p>Revisá tu conexión e intentá de nuevo.</p>' +
      '<div class="actions"><button class="btn btn-secondary" type="button">Reintentar</button></div>';
  } else {
    M.llenar('filtros', M.filtros({ actual: null, stock: true }));
    M.llenar('barra', M.barra({ actualRaiz: null, q: 'sushi', nFiltros: 1 }));
    est.innerHTML = '<span class="badge-ico" aria-hidden="true">' + ico('i-buscar') + '</span>' +
      '<h2 id="estado-titulo">No encontramos productos</h2><p>Nada coincide con «sushi» y los filtros elegidos. Probá con otra palabra o quitá algún filtro.</p>' +
      '<div class="chips">' + M.chip('«sushi»') + M.chip('Solo con stock') + '</div>' +
      '<div class="actions"><button class="btn btn-primary" type="button">Limpiar filtros</button></div>';
  }
})();
</script>
</body>
</html>
