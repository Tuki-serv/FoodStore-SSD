<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup fe-catalogo-filtros-arriba - Escritorio con filtros (Rev 2, pendiente de aprobación)</title>
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="filtros-arriba.css">
</head>
<body data-roles="CLIENT" data-current="catalogo">
<div class="shell" id="shell">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <img class="sidebar-logo" src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <button class="icon-btn btn-collapse" id="btn-collapse" type="button" aria-controls="sidebar" aria-expanded="true" aria-label="Colapsar panel"><svg class="ico" aria-hidden="true"><use href="#i-panel"/></svg></button>
    <button class="icon-btn btn-close" id="btn-close" type="button" aria-label="Cerrar menú"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button>
  </div>
  <nav class="sidebar-nav" id="sidebar-nav" aria-label="Principal"></nav>
  <div class="sidebar-foot">
    <span class="avatar" aria-hidden="true">LP</span>
    <div class="user-meta"><strong>Lucía Pérez</strong><small>CLIENT</small></div>
    <button class="icon-btn btn-logout" type="button" aria-label="Cerrar sesión"><svg class="ico" aria-hidden="true"><use href="#i-salir"/></svg></button>
  </div>
</aside>
<div class="scrim" id="scrim"></div>

<div class="shell-main">
  <div class="banner" id="banner">Mockup fe-catalogo-filtros-arriba · «Hamburguesas» + $ 1.000 – $ 2.000 + «Solo con stock», panel «Precio» abierto · sin columna lateral · Revision 2 · pendiente de aprobación</div>
  <header class="topbar">
    <button class="icon-btn" id="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú"><svg class="ico" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <img src="../../../../design-system/assets/logo.svg" alt="Food Store (logo provisional)">
    <a class="icon-btn" href="#/carrito" aria-label="Carrito, 3 productos"><svg class="ico" aria-hidden="true"><use href="#i-carrito"/></svg><span class="count" aria-hidden="true">3</span></a>
  </header>

  <main class="page page-wide">
    <div class="page-head">
      <h1>Catálogo</h1>
      <p>Elegí lo que tengas ganas y sumalo al carrito.</p>
    </div>
    <div class="cat-layout">
      <div class="cat-main">
        <div id="barra"></div>
        <div class="results-head">
          <h2 class="results-count" id="resultados" tabindex="-1" role="status"></h2>
          <div class="chips" id="chips"></div>
        </div>
        <ul class="prod-grid" id="grilla"></ul>
        <nav class="pager" id="pager" aria-label="Paginación del catálogo">
          <button class="btn btn-secondary btn-sm" type="button" disabled>Anterior</button>
          <span>Página 1 de 2</span>
          <button class="btn btn-secondary btn-sm" type="button">Siguiente</button>
        </nav>
      </div>
    </div>
  </main>
</div>
</div>

<script src="../../../../design-system/brand.js"></script>
<script src="mockup.js"></script>
<script src="catalogo.js"></script>
<script src="filtros-arriba.js"></script>
<script>
(function () {
  var M = MOCK, P = M.P;
  /* Hamburguesas (raiz) + precio 1.000 a 2.000 + solo con stock; panel «Precio» abierto */
  M.llenar('barra', M.barra({ actualRaiz: 1, nFiltros: 3 }) + M.barraEscritorio({ raiz: 1, sub: null, min: '1000', max: '2000', stock: true, popover: true }));
  M.llenar('resultados', '4 productos <small>en Hamburguesas</small>');
  M.llenar('chips', M.chip('Hamburguesas') + M.chip('$ 1.000 – $ 2.000') + M.chip('Solo con stock') + '<button class="link-btn" type="button">Limpiar filtros</button>');
  M.llenar('grilla', [P.clasica, P.bbq, P.vegana, P.sintacc].map(M.tarjeta).join(''));
  document.getElementById('pager').hidden = true;
})();
</script>
</body>
</html>
