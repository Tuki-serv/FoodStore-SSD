<body data-shell="anon" data-current="registrarse">
<main class="auth">
  <div class="auth-intro"><img data-logo="favicon.svg" alt="" width="48" height="48"><h1>Crear cuenta</h1><p>Registrate para hacer pedidos. Al terminar, entrás directo.</p></div>
  <form class="auth-card panel" novalidate aria-label="Crear cuenta">
    <div class="fgrid"><div class="field "><label for="n">Nombre</label><input class="input" id="n" value=""></div><div class="field "><label for="a">Apellido</label><input class="input" id="a" value=""></div><div class="field full"><label for="e">Email</label><input class="input" id="e" value=""></div>
      <div class="field full"><label for="c">Celular (opcional)</label><input class="input" id="c"><span class="hint">Para avisarte sobre tus pedidos.</span></div>
      <div class="field full"><label for="p">Contraseña</label><input class="input" id="p" type="password"><span class="hint">Al menos 8 caracteres.</span></div>
      <div class="field full"><label for="p2">Repetir contraseña</label><input class="input" id="p2" type="password"></div></div>
    <button class="btn btn-primary btn-block" type="submit">Crear cuenta</button>
    <p class="alt">¿Ya tenés cuenta? <a class="link" href="ingresar.html">Ingresá</a></p></form>
</main>
