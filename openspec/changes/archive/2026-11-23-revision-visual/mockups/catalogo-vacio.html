<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo sin resultados · Mockup revision-visual (Revision 4)</title>
<!-- Base aprobada: openspec/changes/archive/2026-11-18-c-16b-fe-catalogo-publico/mockups/catalogo-vacio.html. Re-cableado a design-system Revision 4 (D2-D6). Estados: por defecto: sin resultados («sushi» + «Solo con stock»); ?estado=sin-productos; ?estado=error -->
<link rel="icon" href="../../../../design-system/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-shell="client" data-current="catalogo">
<main class="page has-band">
  <header class="page-band is-sticky"><div class="band-inner">
    
    <div class="band-top">
      <div class="band-titles"><span class="eyebrow">Tienda</span><div class="band-h"><h1>Catálogo</h1></div><div class="band-sub"><p>Elegí lo que tengas ganas y sumalo al carrito.</p></div></div>
      
    </div>
    <div class="band-toolbar"><form class="search" role="search"><label class="sr" for="q">Buscar productos</label><svg class="ico" aria-hidden="true"><use href="#i-buscar"/></svg><input class="input" id="q" type="search" placeholder="Buscar productos" value="sushi"></form>
        <button class="chip filter-btn" type="button"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Filtros<span class="count">1</span></button>
        <span class="vr desktop-only"></span>
        <div class="chips desktop-only" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="true">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="false">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
        <span class="spacer desktop-only"></span>
        <div class="hstack desktop-only"><div class="popover-wrap"><button class="chip" type="button" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Precio</button></div><button class="switch" type="button" role="switch" aria-checked="true"><i></i>Solo con stock</button></div>
      </div>
      <div class="band-scroll mobile-only hide-stuck-m" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="true">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="false">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
      <div hidden></div>
    <div class="band-active"><span class="band-count" role="status">0 productos</span><span class="tag">«sushi»<button type="button" aria-label="Quitar filtro «sushi»"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><span class="tag">Solo con stock<button type="button" aria-label="Quitar filtro Solo con stock"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><button class="link small" type="button">Limpiar filtros</button></div>
  </div></header>
  <div class="page-body">
  <div class="empty zone" id="vacio">
    <span class="halo"><svg class="ico" aria-hidden="true"><use href="#i-buscar"/></svg></span>
    <div><h2>No encontramos productos</h2><p>Nada coincide con «sushi» y los filtros elegidos. Probá con otra palabra o quitá algún filtro.</p>
    <button class="btn btn-secondary" type="button">Limpiar filtros</button></div>
  </div>
  </div>
</main>

<script src="../../../../design-system/brand.js"></script>
<script src="sprite.js"></script>
<script src="mockup.js"></script>
<script>
(function () {
  var M = MOCK, P = M.P, q = M.params;
var e = q.get('estado'), box = document.getElementById('vacio');
if (e === 'sin-productos') { document.querySelector('.band-active').innerHTML = '<span class="band-count">0 productos</span>'; box.innerHTML = '<span class="halo">' + M.ico('vacio') + '</span><div><h2>Todavía no hay productos</h2><p>El local está cargando su menú. Volvé en un rato.</p></div>'; }
if (e === 'error') { document.querySelector('.band-active').innerHTML = '<span class="band-count">Sin resultados</span>'; box.classList.add('error'); box.innerHTML = '<span class="halo">' + M.ico('alerta') + '</span><div><h2>No pudimos cargar los productos</h2><p>Revisá tu conexión e intentá de nuevo.</p><button class="btn btn-secondary" type="button">' + M.ico('reintentar') + 'Reintentar</button></div>'; }
})();
</script>
</body>
</html>
