<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo filtrado por categoría · Mockup revision-visual (Revision 4)</title>
<!-- Base aprobada: openspec/changes/archive/2026-11-19-fe-catalogo-filtros-arriba/mockups/catalogo-escritorio.html. Re-cableado a design-system Revision 4 (D2-D6). Estados: «Hamburguesas» + $ 1.000 – $ 2.000 + «Solo con stock», panel «Precio» abierto; categoría omitida en las tarjetas -->
<link rel="icon" href="../../../../design-system/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-shell="client" data-current="catalogo">
<main class="page has-band">
  <header class="page-band is-sticky"><div class="band-inner">
    
    <div class="band-top">
      <div class="band-titles"><span class="eyebrow">Tienda</span><div class="band-h"><h1>Catálogo</h1></div><div class="band-sub"><p>Elegí lo que tengas ganas y sumalo al carrito.</p></div></div>
      
    </div>
    <div class="band-toolbar"><form class="search" role="search"><label class="sr" for="q">Buscar productos</label><svg class="ico" aria-hidden="true"><use href="#i-buscar"/></svg><input class="input" id="q" type="search" placeholder="Buscar productos" value=""></form>
        <button class="chip filter-btn" type="button"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Filtros<span class="count">3</span></button>
        <span class="vr desktop-only"></span>
        <div class="chips desktop-only" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="false">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="true">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
        <span class="spacer desktop-only"></span>
        <div class="hstack desktop-only"><div class="popover-wrap"><button class="chip" type="button" aria-expanded="true" aria-pressed="true"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Precio: $ 1.000 – $ 2.000</button>
        <div class="popover" role="dialog" aria-label="Filtrar por precio">
          <div class="range">
            <div class="field"><label for="pmin">Mínimo</label><div class="affix"><span>$</span><input class="input" id="pmin" inputmode="numeric" value="1000"></div></div>
            <div class="field"><label for="pmax">Máximo</label><div class="affix"><span>$</span><input class="input" id="pmax" inputmode="numeric" value="2000"></div></div>
          </div>
          
          <div class="hstack" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" type="button">Quitar</button><button class="btn btn-primary btn-sm" type="button">Aplicar</button></div>
        </div></div><button class="switch" type="button" role="switch" aria-checked="true"><i></i>Solo con stock</button></div>
      </div>
      <div class="band-scroll mobile-only hide-stuck-m" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="false">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="true">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
      <div class="subrow desktop-only"><span class="xs muted" style="margin-right:var(--space-2)">En Hamburguesas:</span><div class="seg" role="group" aria-label="Subcategorías"><button type="button" aria-pressed="true">Todas</button><button type="button" aria-pressed="false">Sin TACC</button><button type="button" aria-pressed="false">Veganas</button></div></div>
    <div class="band-active"><span class="band-count" role="status">4 productos <small>en Hamburguesas</small></span><span class="tag">Hamburguesas<button type="button" aria-label="Quitar filtro Hamburguesas"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><span class="tag">$ 1.000 – $ 2.000<button type="button" aria-label="Quitar filtro $ 1.000 – $ 2.000"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><span class="tag">Solo con stock<button type="button" aria-label="Quitar filtro Solo con stock"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><button class="link small" type="button">Limpiar filtros</button></div>
  </div></header>
  <div class="page-body"><ul class="prod-grid stagger" id="grilla"></ul></div>
</main>

<script src="../../../../design-system/brand.js"></script>
<script src="sprite.js"></script>
<script src="mockup.js"></script>
<script>
(function () {
  var M = MOCK, P = M.P, q = M.params;
M.grilla('grilla', [P.clasica, P.bbq, P.vegana, P.sintacc], { filtro: 'Hamburguesas' });
})();
</script>
</body>
</html>
