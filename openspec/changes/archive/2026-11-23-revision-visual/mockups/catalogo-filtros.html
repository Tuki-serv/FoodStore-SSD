<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo: filtros y validación · Mockup revision-visual (Revision 4)</title>
<!-- Base aprobada: openspec/changes/archive/2026-11-18-c-16b-fe-catalogo-publico/mockups/catalogo-filtros.html. Re-cableado a design-system Revision 4 (D2-D6). Estados: «Veganas» elegida, rango inválido 3000/1000 con error; mobile: hoja «Filtros» abierta -->
<link rel="icon" href="../../../../design-system/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../../../design-system/tokens.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="pages.css">
</head>
<body data-shell="client" data-current="catalogo" class="has-sheet">
<main class="page has-band">
  <header class="page-band is-sticky"><div class="band-inner">
    
    <div class="band-top">
      <div class="band-titles"><span class="eyebrow">Tienda</span><div class="band-h"><h1>Catálogo</h1></div><div class="band-sub"><p>Elegí lo que tengas ganas y sumalo al carrito.</p></div></div>
      
    </div>
    <div class="band-toolbar"><form class="search" role="search"><label class="sr" for="q">Buscar productos</label><svg class="ico" aria-hidden="true"><use href="#i-buscar"/></svg><input class="input" id="q" type="search" placeholder="Buscar productos" value=""></form>
        <button class="chip filter-btn" type="button"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Filtros<span class="count">2</span></button>
        <span class="vr desktop-only"></span>
        <div class="chips desktop-only" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="false">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="true">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
        <span class="spacer desktop-only"></span>
        <div class="hstack desktop-only"><div class="popover-wrap"><button class="chip" type="button" aria-expanded="true"><svg class="ico" aria-hidden="true"><use href="#i-filtros"/></svg>Precio</button>
        <div class="popover" role="dialog" aria-label="Filtrar por precio">
          <div class="range">
            <div class="field"><label for="pmin">Mínimo</label><div class="affix"><span>$</span><input class="input" id="pmin" inputmode="numeric" value="3000" aria-invalid="true"></div></div>
            <div class="field"><label for="pmax">Máximo</label><div class="affix"><span>$</span><input class="input" id="pmax" inputmode="numeric" value="1000"></div></div>
          </div>
          <p class="err" role="alert">El mínimo no puede superar al máximo.</p>
          <div class="hstack" style="justify-content:flex-end"><button class="btn btn-ghost btn-sm" type="button">Quitar</button><button class="btn btn-primary btn-sm" type="button">Aplicar</button></div>
        </div></div><button class="switch" type="button" role="switch" aria-checked="false"><i></i>Solo con stock</button></div>
      </div>
      <div class="band-scroll mobile-only hide-stuck-m" role="group" aria-label="Categorías"><button class="chip" type="button" aria-pressed="false">Todas</button><button class="chip" type="button" aria-pressed="false">Bebidas</button><button class="chip" type="button" aria-pressed="true">Hamburguesas</button><button class="chip" type="button" aria-pressed="false">Postres</button></div>
      <div class="subrow desktop-only"><span class="xs muted" style="margin-right:var(--space-2)">En Hamburguesas:</span><div class="seg" role="group" aria-label="Subcategorías"><button type="button" aria-pressed="false">Todas</button><button type="button" aria-pressed="false">Sin TACC</button><button type="button" aria-pressed="true">Veganas</button></div></div>
    <div class="band-active"><span class="band-count" role="status">1 producto <small>en Veganas</small></span><span class="tag">Veganas<button type="button" aria-label="Quitar filtro Veganas"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></span><button class="link small" type="button">Limpiar filtros</button></div>
  </div></header>
  <div class="page-body"><ul class="prod-grid" id="grilla"></ul></div>
</main>
<div class="mobile-only" data-after-main>
  <div class="sheet-scrim"></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">
    <div class="sheet-head"><h2 id="sheet-t">Filtros</h2><button class="icon-btn" type="button" aria-label="Cerrar filtros"><svg class="ico" aria-hidden="true"><use href="#i-cerrar"/></svg></button></div>
    <div class="sheet-body">
      <fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-2)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Categoría</legend>
        <ul class="tree-list">
          <li><label class="check"><input type="radio" name="c">Todas</label></li>
          <li><label class="check"><input type="radio" name="c">Bebidas</label></li>
          <li class="sub"><label class="check"><input type="radio" name="c">Gaseosas</label></li>
          <li><label class="check"><input type="radio" name="c">Hamburguesas</label></li>
          <li class="sub"><label class="check"><input type="radio" name="c">Sin TACC</label></li>
          <li class="sub"><label class="check"><input type="radio" name="c" checked><strong>Veganas</strong></label></li>
          <li><label class="check"><input type="radio" name="c">Postres</label></li>
        </ul></fieldset>
      <fieldset style="border:0;margin:0;padding:0;display:grid;gap:var(--space-3)"><legend class="eyebrow" style="margin-bottom:var(--space-2)">Precio</legend>
        <div class="range">
          <div class="field"><label for="smin">Mínimo</label><div class="affix"><span>$</span><input class="input" id="smin" value="3000" aria-invalid="true"></div></div>
          <div class="field"><label for="smax">Máximo</label><div class="affix"><span>$</span><input class="input" id="smax" value="1000"></div></div>
        </div><p class="err">El mínimo no puede superar al máximo.</p></fieldset>
      <div style="display:grid;gap:var(--space-1)"><button class="switch" type="button" role="switch" aria-checked="false"><i></i>Solo con stock</button><span class="hint">Oculta los productos agotados</span></div>
    </div>
    <div class="sheet-foot"><button class="btn btn-secondary" type="button">Limpiar</button><button class="btn btn-primary" type="button">Ver 1 producto</button></div>
  </div>
</div>
<script src="../../../../design-system/brand.js"></script>
<script src="sprite.js"></script>
<script src="mockup.js"></script>
<script>
(function () {
  var M = MOCK, P = M.P, q = M.params;
M.grilla('grilla', [P.vegana], { filtro: 'Veganas' });
})();
</script>
</body>
</html>
